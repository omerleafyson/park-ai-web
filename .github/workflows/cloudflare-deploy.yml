name: Cloudflare production site deploy
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'wrangler.toml'
      - '.github/workflows/cloudflare-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify expected production target
        run: |
          test -f wrangler.toml
          grep -q '^name = "park-ai-web"' wrangler.toml
          grep -q 'directory = "./apps/web/dist"' wrangler.toml
          grep -q 'html_handling = "drop-trailing-slash"' wrangler.toml
          test -f apps/web/support.html
          test -f apps/web/gizlilik-politikasi.html
          test -f apps/web/hesap-silme.html
      - name: Verify credentials and identify one Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
          PROVIDED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing existing Cloudflare deployment API token. No deployment attempted."
            exit 1
          fi
          if [ -n "$PROVIDED_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$PROVIDED_ACCOUNT_ID" >> "$GITHUB_ENV"
          else
            account_json=$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Accept: application/json" "https://api.cloudflare.com/client/v4/accounts?per_page=50")
            ACCOUNT_JSON="$account_json" node -e 'const x=JSON.parse(process.env.ACCOUNT_JSON||"{}");if(!x.success||!Array.isArray(x.result)||x.result.length!==1||!x.result[0].id){console.error("::error::Cloudflare account cannot be determined unambiguously.");process.exit(1)}console.log("CLOUDFLARE_ACCOUNT_ID="+x.result[0].id)' >> "$GITHUB_ENV"
          fi
      - name: Build exact static site
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -s apps/web/dist/index.html
          test -s apps/web/dist/support.html
          test -s apps/web/dist/gizlilik-politikasi.html
          test -s apps/web/dist/hesap-silme.html
      - name: Deploy existing named production Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
        run: npx --yes wrangler@4.135.0 deploy --config wrangler.toml
      - name: Verify official custom-domain pages
        run: |
          for slug in support gizlilik-politikasi hesap-silme; do
            url="https://parkai.com.tr/$slug"
            status=$(curl -L -sS -o /tmp/site-response.html --max-time 30 -w '%{http_code}' "$url")
            if [ "$status" != "200" ]; then
              echo "::error::$url HTTP $status after deployment"
              exit 1
            fi
            grep -qi '<html' /tmp/site-response.html
          done
