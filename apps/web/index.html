<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="PARK AI çok yakında. Akıllı park deneyiminin geleceğini hazırlıyoruz.">
  <meta name="robots" content="index,follow">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="tr_TR">
  <meta property="og:title" content="PARK AI | Çok Yakında">
  <meta property="og:description" content="Akıllı park deneyiminin geleceğini hazırlıyoruz. Yakında sizlerle.">
  <meta property="og:url" content="https://parkai.com.tr/">
  <link rel="canonical" href="https://parkai.com.tr/">
  <link rel="icon" type="image/webp" href="/logo.webp">
  <title>PARK AI | Çok Yakında</title>
  <style>
    :root{color-scheme:dark;--green:#98ff65;--white:#fff;--bg:#000}
    *,*::before,*::after{box-sizing:border-box}
    html{background:#000;color:#fff;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    body{margin:0;min-height:100svh;overflow-x:hidden;background:#000}
    .page{position:relative;isolation:isolate;display:flex;flex-direction:column;min-height:100svh;align-items:center;justify-content:space-between}
    .page::before{position:fixed;inset:0;z-index:-2;content:"";pointer-events:none;background:#000 url("/background.avif") center center/cover no-repeat}
    .page::after{position:fixed;inset:0;z-index:-1;content:"";pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.24) 0%,rgba(0,0,0,.53) 54%,rgba(0,0,0,.64) 100%)}
    .content{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;width:min(100%,850px);padding:clamp(68px,10vh,110px) 24px 52px;text-align:center}
    .logo{display:block;width:clamp(128px,17vw,182px);height:auto;aspect-ratio:599/817;object-fit:contain;filter:drop-shadow(0 8px 24px #000e);mix-blend-mode:screen}
    .brand{font-size:clamp(2.3rem,5vw,3.6rem);font-weight:800;letter-spacing:-.055em;margin:12px 0 0;text-shadow:0 2px 20px #000,0 4px 40px #000}
    .rule{width:116px;height:2px;margin:23px 0 29px;background:linear-gradient(90deg,transparent,#b6ffa3,transparent);box-shadow:0 0 18px #82ff6580}
    h1{font-size:clamp(3.15rem,8vw,6rem);font-weight:850;letter-spacing:-.07em;line-height:1.06;margin:0 0 20px;text-shadow:0 4px 28px #000,0 8px 46px #000}
    .subtitle{font-size:clamp(1.05rem,2.5vw,1.5rem);line-height:1.55;font-weight:450;margin:0;max-width:595px;text-wrap:balance;text-shadow:0 3px 20px #000,0 4px 36px #000}
    .status{display:inline-flex;align-items:center;justify-content:center;margin-top:34px;padding:15px 42px;border-radius:999px;border:1px solid #c2ffc4;color:#fff;background:linear-gradient(110deg,#195a23eb,#25914aeb 58%,#2c7e7ceb);box-shadow:0 6px 35px #000b,0 0 23px #51f47a66,inset 0 1px 2px #fff6;font-weight:750;font-size:clamp(1.05rem,2.2vw,1.25rem);cursor:default;user-select:none}
    .tagline{text-transform:uppercase;letter-spacing:.22em;font-size:.73rem;font-weight:650;margin-top:36px;color:#efffee;text-shadow:0 2px 18px #000}
    footer{padding:24px 16px max(24px,env(safe-area-inset-bottom));text-align:center;font-size:.8rem;color:#edf9ee;text-shadow:0 2px 20px #000,0 2px 34px #000}
    @media(max-width:550px){
      .content{padding:50px 20px 36px}
      .logo{width:clamp(122px,34vw,156px)}
      .brand{font-size:clamp(2rem,9vw,2.8rem)}
      .rule{margin:22px 0 28px}
      h1{font-size:clamp(3rem,13vw,4.5rem)}
      .subtitle{font-size:clamp(1rem,4.3vw,1.23rem)}
      .status{margin-top:29px;padding:15px 35px}
      .tagline{font-size:.62rem;letter-spacing:.13em;margin-top:29px}
      footer{font-size:.7rem}
      .page::before{background-position:50% 50%}
    }
    @media(max-height:680px){.content{padding-top:36px;padding-bottom:22px}.logo{width:105px}.rule{margin:16px 0 20px}.status{margin-top:20px}.tagline{margin-top:18px}}
  </style>
</head>
<body>
  <div class="page">
    <main class="content">
      <img class="logo" src="/logo.webp" alt="PARK AI orijinal yeşil P ve araç tarama logosu" width="599" height="817" decoding="async" fetchpriority="high">
      <p class="brand">PARK AI</p>
      <span class="rule" aria-hidden="true"></span>
      <h1>Çok Yakında</h1>
      <p class="subtitle">Park etmenin daha akıllı bir geleceği için hazırlanıyoruz. Yeni deneyimimiz çok yakında sizlerle.</p>
      <div class="status" role="status">Yakında Sizlerle</div>
      <p class="tagline">Teknoloji · Mobilite · Gelecek</p>
    </main>
    <footer>© 2026 PARK AI · AURA Technology</footer>
  </div>
</body>
</html>
